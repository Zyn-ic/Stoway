site_name: Stoway
site_description: A Roblox inventory framework in layers — pure-Luau CoreStore, server orchestration, Fusion client.
site_author: yyumchi
site_url: https://zyn-ic.github.io/Stoway/
repo_url: https://github.com/Zyn-ic/Stoway
docs_dir: docs

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

nav:
  - Home: index.md
  - Start Here:
    - Quickstart: quickstart.md
    - Life of a Swap: life-of-a-swap.md
    - Glossary: glossary.md
  - Concepts:
    - Architecture: architecture.md
    - Metadata: metadata.md
    - Settings: settings.md
    - Trust Model: trust.md
  - Build:
    - Building on Top: building-on-top.md
    - Server Routes & Wire: api/server.md
    - Adapters: adapters.md
    - Tools & Templates: tools.md
    - Client Events & Hooks: client-surface.md
    - Skins & Layouts: skins-layouts.md
    - Debug Console: conch.md
  - Examples:
    - Cooldowns: examples/cooldowns.md
    - Locked Slots: examples/locked-slots.md
    - New-Item Glow: examples/new-item-glow.md
  - Reference:
    - CoreStore API: api/corestore.md
    - Error Codes: errors.md
    - Wire Reference: wire.md
  - Engine Rules:
    - CoreStore Specification: specs/CoreStoreSpecification.md
    - Invariants: specs/Invariants.md
    - Swap Rules: specs/SwapRules.md
    - Move Rules: specs/MoveRules.md
    - Split Rules: specs/SplitRules.md
    - Sorting Rules: specs/SortingRules.md
    - Metadata Update Rules: specs/MetadataUpdateRules.md
    - Metadata Wire Schema: specs/MetadataWireSchema.md
    - Settings Sync: specs/SettingsSync.md
  - Help:
    - Troubleshooting: troubleshooting.md
    - Contributing: contributing.md
    - Dependencies & Credits: dependencies.md
    - Roadmap & Limitations: roadmap.md
